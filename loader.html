<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Loader</title>
<style>
html,body{margin:0;height:100%;background:#000}
iframe{width:100%;height:100%;border:none}
#s{position:absolute;top:10px;left:10px;color:#fff;font-family:sans-serif;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:6px;z-index:999}
</style>
</head>
<body>

<div id="s">Loading...</div>
<iframe id="f"></iframe>

<script>
(()=>{

const A=atob("aHR0cHM6Ly95YW5neWluZ25ldHdvcmstaHViYXBpLmhmLnNwYWNlLw=="),
U=atob("aHR0cHM6Ly9jbGFwcGVkd2FyZS5naXRodWIuaW8vWWluZ0h1Yi9sb2FkZXIuaHRtbA=="),
T=8e3;

let c=null,t=null;

const v=async()=>{
 try{
  const r=await fetch(U+"?t="+Date.now(),{cache:"no-store"}),
  x=await r.text(),
  y=document.documentElement.outerHTML;
  if(x.trim()!==y.trim()){
   document.open();
   document.write(x);
   document.close();
   return 1;
  }
 }catch(e){}
 return 0;
};

const q=async(b=null)=>{
 let u=A;
 if(b)u+="?failed="+encodeURIComponent(b);
 const r=await fetch(u),
 d=await r.json();
 return d.url;
};

const l=(u)=>{
 c=u;
 document.getElementById("s").textContent="Trying: [REDACTED]";
 const i=document.getElementById("f");
 i.src=u;
 clearTimeout(t);
 t=setTimeout(()=>{x(u)},T);
 i.onload=()=>{
  clearTimeout(t);
  document.getElementById("s").textContent="Loaded: VALID LINK";
 };
 i.onerror=()=>{
  clearTimeout(t);
  x(u);
 };
};

const x=async(b)=>{
 document.getElementById("s").textContent="Blocked, requesting new URL...";
 const n=await q(b);
 l(n);
};

(async()=>{
 if(await v())return;
 const u=await q();
 l(u);
})();

})();
</script>

</body>
</html>
